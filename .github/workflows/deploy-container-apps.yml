name: Build and deploy HabitQuest containers

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-habitquest
  ACR_NAME: habitquestacr50887
  ACR_LOGIN_SERVER: habitquestacr50887.azurecr.io
  FRONTEND_APP: habitquest-web-aca-50887
  BACKEND_APP: habitquest-api-aca-50887
  BACKEND_URL: https://habitquest-api-aca-50887.whitegrass-9925aedb.koreacentral.azurecontainerapps.io

concurrency:
  group: habitquest-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build and push backend image
        run: |
          docker build \
            --tag "$ACR_LOGIN_SERVER/habitquest-backend:${GITHUB_SHA}" \
            ./backend
          docker push "$ACR_LOGIN_SERVER/habitquest-backend:${GITHUB_SHA}"

      - name: Build and push frontend image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=/api \
            --tag "$ACR_LOGIN_SERVER/habitquest-frontend:${GITHUB_SHA}" \
            ./frontend
          docker push "$ACR_LOGIN_SERVER/habitquest-frontend:${GITHUB_SHA}"

      - name: Deploy backend Container App
        run: |
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$BACKEND_APP" \
            --image "$ACR_LOGIN_SERVER/habitquest-backend:${GITHUB_SHA}"

      - name: Deploy frontend Container App
        run: |
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FRONTEND_APP" \
            --image "$ACR_LOGIN_SERVER/habitquest-frontend:${GITHUB_SHA}" \
            --set-env-vars "BACKEND_URL=$BACKEND_URL"

      - name: Verify revisions
        run: |
          az containerapp revision list \
            --resource-group "$RESOURCE_GROUP" \
            --name "$BACKEND_APP" \
            --query "[?properties.active].{name:name,health:properties.healthState,traffic:properties.trafficWeight}" \
            --output table
          az containerapp revision list \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FRONTEND_APP" \
            --query "[?properties.active].{name:name,health:properties.healthState,traffic:properties.trafficWeight}" \
            --output table

      - name: Smoke test public endpoints
        run: |
          curl --fail --silent --show-error "$BACKEND_URL/health"
          curl --fail --silent --show-error "https://habitquest-web-aca-50887.whitegrass-9925aedb.koreacentral.azurecontainerapps.io/"
          curl --fail --silent --show-error "https://habitquest-web-aca-50887.whitegrass-9925aedb.koreacentral.azurecontainerapps.io/api/health"
