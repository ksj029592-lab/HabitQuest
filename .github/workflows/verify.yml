name: Verify HabitQuest

on:
  pull_request:
    branches: [master]
  push:
    branches-ignore: [master]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: habitquest_test
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: habitquest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U habitquest_test -d habitquest_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Build and test backend against isolated PostgreSQL
        working-directory: backend
        env:
          HABITQUEST_TEST_DATABASE_URL: postgresql://habitquest_test:ci-local-only@127.0.0.1:5432/habitquest_test
        run: |
          npm ci
          npx prisma generate
          DATABASE_URL="$HABITQUEST_TEST_DATABASE_URL" npx prisma db push --skip-generate
          npm run build
          npm test -- --runInBand
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
